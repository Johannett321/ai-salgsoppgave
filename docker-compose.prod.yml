# Produksjonsoppsett. Kjører ferdigbygde bilder fra ECR i stedet for å bygge
# fra kildekode, og rulles ut av .github/workflows/production-release.yml.
#
# For lokal kjøring, bruk docker-compose.yml i stedet.
#
#   docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: ankane/pgvector
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aisalgsoppgavedb
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      PGDATA: /data
    ports:
      - "5432:5432"
    volumes:
      - /data/database:/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME} -d aisalgsoppgavedb"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ${ECR_REGISTRY}/backend:latest
    container_name: backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aisalgsoppgavedb
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SALGSOPPGAVE_DATADIR: /data
      BACKEND_URL: ${BACKEND_URL}
      ENVIRONMENT: PRODUCTION
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OAUTH2_GOOGLE_CLIENT_ID: ${OAUTH2_GOOGLE_CLIENT_ID}
      OAUTH2_GOOGLE_CLIENT_SECRET: ${OAUTH2_GOOGLE_CLIENT_SECRET}
      OAUTH2_FACEBOOK_CLIENT_ID: ${OAUTH2_FACEBOOK_CLIENT_ID}
      OAUTH2_FACEBOOK_CLIENT_SECRET: ${OAUTH2_FACEBOOK_CLIENT_SECRET}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      MAILCHIMP_API_KEY: ${MAILCHIMP_API_KEY}
      MAILCHIMP_SERVER_PREFIX: ${MAILCHIMP_SERVER_PREFIX}
      MAILCHIMP_LIST_ID: ${MAILCHIMP_LIST_ID}
      DISCORD_WEBHOOK_ERROR: ${DISCORD_WEBHOOK_ERROR}
      DISCORD_WEBHOOK_NOTIFICATIONS: ${DISCORD_WEBHOOK_NOTIFICATIONS}
    ports:
      - "8080:8080"
    volumes:
      - /data/files:/data

  frontend:
    image: ${ECR_REGISTRY}/frontend:latest
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
