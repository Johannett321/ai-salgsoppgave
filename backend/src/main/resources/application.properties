spring.application.name=SpringAI
salgsoppgave.test=true

# ---------------------------------------------------------------------------
# Alt under kan overstyres med miljøvariabler. Standardverdiene er laget for
# lokal kjøring, slik at applikasjonen starter uten noen ekstra konfigurasjon
# utover de to LLM-nøklene. Ingen hemmeligheter skal ligge i denne filen.
# ---------------------------------------------------------------------------

# --- Database --------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aisalgsoppgavedb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Liquibase -------------------------------------------------------------
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# --- Spring AI -------------------------------------------------------------
# Nøklene leses fra miljøvariabler. Uten dem starter applikasjonen fint, men
# selve analysen feiler når den prøver å kalle modellen.
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.openai.api-key=${OPENAI_API_KEY:}

# Én chat-modell og én embedding-modell, ellers blir injiseringen tvetydig fordi
# begge leverandørene tilbyr begge deler.
spring.ai.model.chat=anthropic
spring.ai.model.embedding=openai

spring.ai.anthropic.chat.options.model=${ANTHROPIC_MODEL:claude-sonnet-4-5}
spring.ai.anthropic.chat.options.max-tokens=2000
spring.ai.anthropic.chat.options.temperature=0.9

spring.ai.openai.embedding.options.model=text-embedding-3-small

# pgvector. Tabellen vector_store opprettes av Liquibase, ikke av Spring AI.
# Dimensjonen settes eksplisitt slik at oppstart ikke krever et kall til OpenAI.
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# --- Filer -----------------------------------------------------------------
# Hvor opplastede salgsoppgaver og markedsføringsfiler lagres.
salgsoppgave.datadir=${SALGSOPPGAVE_DATADIR:../data/files}

# --- URL-er ----------------------------------------------------------------
# Den offentlig nåbare adressen til backend. Brukes i e-poster og som
# OAuth-redirect-base. Lokalt holder localhost; skal andre nå den, trengs tunnel.
backend.url=${BACKEND_URL:http://localhost:8080}

# --- Sesjoner --------------------------------------------------------------
# Merk: sesjonene ligger i minnet i webserveren – Spring Session er ikke på
# klassestien, så de går tapt ved omstart og skalerer ikke over flere instanser.
server.servlet.session.persistent=true
server.servlet.session.timeout=86400

# --- Innlogging med Google/Facebook (valgfritt) ----------------------------
# La stå urørt hvis du ikke bruker OAuth. Verdiene kan ikke være tomme, ellers
# nekter Spring Security å starte – derfor plassholderen.
spring.security.oauth2.client.registration.google.client-id=${OAUTH2_GOOGLE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH2_GOOGLE_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.facebook.client-id=${OAUTH2_FACEBOOK_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.facebook.client-secret=${OAUTH2_FACEBOOK_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.facebook.scope=public_profile,email

# --- E-post (valgfritt) ----------------------------------------------------
spring.mail.host=${SPRING_MAIL_HOST:smtp.domeneshop.no}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Mailchimp (valgfritt) -------------------------------------------------
mailchimp.api.key=${MAILCHIMP_API_KEY:}
mailchimp.server.prefix=${MAILCHIMP_SERVER_PREFIX:}
mailchimp.list.id=${MAILCHIMP_LIST_ID:}

# --- Discord-varsler (valgfritt) -------------------------------------------
discord.webhook.error=${DISCORD_WEBHOOK_ERROR:}
discord.webhook.notifications=${DISCORD_WEBHOOK_NOTIFICATIONS:}

# --- Opplasting ------------------------------------------------------------
# 50 MB, som trengs for å ta imot en hel salgsoppgave.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --- Logging ---------------------------------------------------------------
logging.level.com.johansvartdal.SpringAI=${LOG_LEVEL:info}
